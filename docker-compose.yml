services:
  postgres:
    image: postgres:16.4-alpine
    container_name: samt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samt_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-samt_v1_1}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - samt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samt} -d ${POSTGRES_DB:-samt_v1_1}"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  samt_pgdata:
