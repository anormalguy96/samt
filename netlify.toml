[build]
  base = "prototype"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/prototype/dist/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/prototype/dist/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
